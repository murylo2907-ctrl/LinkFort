<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ativar conta | Portal do Parceiro | Link Forte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/parceiro.css">
  <link rel="icon" href="../assets/images/LINKFORTE-vetor.png">
</head>
<body class="portal-body portal-body--centered">
  <main class="portal-login">
    <div class="portal-login__card">
      <img src="../assets/images/LINKFORTE-vetor.png" alt="Link Forte" class="portal-login__logo">
      <h1>Ativar conta de parceiro</h1>
      <p id="invite-subtitle" class="portal-login__subtitle">Carregando convite…</p>

      <div id="ativar-alert" class="portal-alert portal-alert--error" hidden></div>

      <form id="ativar-form" hidden>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" readonly required>
        </div>
        <div class="form-group">
          <label for="password">Crie sua senha</label>
          <input type="password" id="password" name="password" minlength="6" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirme a senha</label>
          <input type="password" id="password_confirm" name="password_confirm" minlength="6" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Ativar e entrar</button>
      </form>

      <p class="portal-login__footer">
        <a href="login.html">Já tem conta? Entrar</a>
      </p>
    </div>
  </main>
  <script>window.PORTAL_BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/parceiro-auth.js"></script>
  <script src="../assets/js/parceiro-ativar.js"></script>
</body>
</html>
