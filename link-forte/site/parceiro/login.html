<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Portal do Parceiro | Link Forte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/parceiro.css">
  <link rel="icon" href="../assets/images/LINKFORTE-vetor.png">
</head>
<body class="portal-body">
  <main class="portal-login">
    <div class="portal-login__card">
      <img src="../assets/images/LINKFORTE-vetor.png" alt="Link Forte">
      <h1>Portal do Parceiro</h1>
      <p>Acompanhe suas indicações e ganhos</p>
      <div id="login-alert" class="portal-alert portal-alert--error" hidden></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem">Entrar</button>
      </form>
    </div>
  </main>
  <script>window.PORTAL_BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/parceiro-auth.js"></script>
  <script src="../assets/js/parceiro-login.js"></script>
</body>
</html>
